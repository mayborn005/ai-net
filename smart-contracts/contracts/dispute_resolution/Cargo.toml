[package]
name = "dispute-resolution"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "=22.0.11" }
gas-interface = { path = "../gas_interface" }

[dev-dependencies]
soroban-sdk = { version = "=22.0.11", features = ["testutils"] }
agent_registry = { path = "../agent_registry" }

contract-test-utils = { path = "../../test-utils" }
