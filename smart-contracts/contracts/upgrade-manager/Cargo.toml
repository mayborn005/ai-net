[package]
name = "upgrade-manager"
version = "0.1.0"
edition = "2021"

[lib]
# rlib is required so agent-registry can link this crate as a
# dependency; cdylib alone only produces a loadable contract artifact.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned exactly, matching every other contract in this workspace. Two copies
# of soroban-sdk in one build would produce incompatible `Env`/type encodings
# at the wasm boundary.
soroban-sdk = "=22.0.11"

[dev-dependencies]
soroban-sdk = { version = "=22.0.11", features = ["testutils"] }
# Integration tests in tests/ link this crate without `cfg(test)`; enabling
# `testutils` routes `swap_wasm` through the mock deployer they assert on.
upgrade-manager = { path = ".", features = ["testutils"] }

[features]
# Exports the UpgradeManager contract entry points. On by default so this crate
# still builds as a deployable contract, but agent-registry links it with
# default-features = false: a dependency that exports contract symbols would
# collide with the dependent's own exports at wasm link time.
default = ["contract"]
contract = []
testutils = ["soroban-sdk/testutils"]
